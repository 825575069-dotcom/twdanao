# YesGo 手机端
# 域名：twdanaom.88yldh.com
# 功能：H5 移动端 Web 版 + API 反向代理
server {
    listen 80;
    server_name twdanaom.88yldh.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name twdanaom.88yldh.com;

    ssl_certificate     /etc/letsencrypt/live/88yldh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88yldh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /home/web/twdanao/mobile;
    index index.html;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Gunicorn :3008
    location /api/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types application/json application/javascript text/plain text/css;

    access_log /var/log/nginx/twdanaom.access.log;
    error_log  /var/log/nginx/twdanaom.error.log;
}

# YesGo 后台 API
# 域名：twdanaob.88yldh.com
# 功能：API 反向代理到 Gunicorn :3008（纯 API，无前端界面）
server {
    listen 80;
    server_name twdanaob.88yldh.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name twdanaob.88yldh.com;

    ssl_certificate     /etc/letsencrypt/live/88yldh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88yldh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # API 反向代理到 Gunicorn :3008
    location /api/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Django Admin
    location /django-admin/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django 静态文件
    location /static/ {
        alias /home/web/twdanao/staticfiles/;
    }

    # Django Media
    location /media/ {
        alias /home/web/twdanao/media/;
    }

    gzip on;
    gzip_types application/json application/javascript text/plain text/css;

    access_log /var/log/nginx/twdanaob.access.log;
    error_log  /var/log/nginx/twdanaob.error.log;
}

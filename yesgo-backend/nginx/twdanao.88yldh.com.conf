# YesGo 第三层~网页端 + 第二层~天网大脑管理后台
# 域名：twdanao.88yldh.com
# 功能：桌面版 Web 预览（/）+ 天网大脑管理后台（/admin/）+ API 反向代理（/api/）
server {
    listen 80;
    server_name twdanao.88yldh.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name twdanao.88yldh.com;

    ssl_certificate     /etc/letsencrypt/live/88yldh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88yldh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ---- 第二层~天网大脑管理后台 ----
    # Redirect /admin to /admin/
    location = /admin {
        return 301 /admin/;
    }

    # 管理后台 SPA
    location /admin/ {
        root /home/web/twdanao;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 管理后台静态资源长期缓存（文件名含 hash）
    location ~* ^/admin/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        root /home/web/twdanao;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- 第三层~网页端（桌面版 Web 预览）----
    # SPA history fallback
    location / {
        root /home/web/twdanao/frontend;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 桌面端静态资源长期缓存（文件名含 hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        root /home/web/twdanao/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API 反向代理到 Gunicorn :3008
    location /api/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types application/json application/javascript text/plain text/css;

    access_log /var/log/nginx/twdanao.access.log;
    error_log  /var/log/nginx/twdanao.error.log;
}

# ============================================================
# YesGo 天网大脑 — Docker Compose 全栈编排
# 服务：Django + PostgreSQL + Redis + Celery Worker + Celery Beat + Nginx
# ============================================================
version: '3.8'

services:
  # —— PostgreSQL 数据库 ——
  postgres:
    image: postgres:16-alpine
    container_name: yesgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yesgo}
      POSTGRES_USER: ${POSTGRES_USER:-yesgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yesgo123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yesgo} -d ${POSTGRES_DB:-yesgo}']
      interval: 10s
      timeout: 5s
      retries: 5

  # —— Redis 缓存/消息队列 ——
  redis:
    image: redis:7-alpine
    container_name: yesgo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # —— Django Web 应用 ——
  web:
    build: .
    container_name: yesgo-web
    restart: unless-stopped
    environment:
      - DB_ENGINE=postgresql
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - POSTGRES_DB=${POSTGRES_DB:-yesgo}
      - POSTGRES_USER=${POSTGRES_USER:-yesgo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yesgo123}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_CACHE_URL=redis://redis:6379/2
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - LOAD_SEED_DATA=${LOAD_SEED_DATA:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
    expose:
      - '8000'

  # —— Celery Worker（异步任务） ——
  celery-worker:
    build: .
    container_name: yesgo-celery-worker
    restart: unless-stopped
    command: celery -A config.celery worker -l info -Q default,memory,model,chat -c 4
    environment:
      - DB_ENGINE=postgresql
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - POSTGRES_DB=${POSTGRES_DB:-yesgo}
      - POSTGRES_USER=${POSTGRES_USER:-yesgo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yesgo123}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # —— Celery Beat（定时任务调度） ——
  celery-beat:
    build: .
    container_name: yesgo-celery-beat
    restart: unless-stopped
    command: celery -A config.celery beat -l info
    environment:
      - DB_ENGINE=postgresql
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - POSTGRES_DB=${POSTGRES_DB:-yesgo}
      - POSTGRES_USER=${POSTGRES_USER:-yesgo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yesgo123}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # —— Nginx 反向代理 ——
  nginx:
    image: nginx:alpine
    container_name: yesgo-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-80}:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
      - ./media:/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:

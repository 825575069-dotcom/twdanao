# twdanaob.88yldh.com - 天网大脑后端 API
server {
    listen 80;
    server_name twdanaob.88yldh.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name twdanaob.88yldh.com;

    ssl_certificate /etc/letsencrypt/live/88yldh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88yldh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /static/ {
        alias /home/web/twdanao/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/web/twdanao/media/;
        expires 7d;
    }

    access_log /var/log/nginx/twdanaob.access.log;
    error_log /var/log/nginx/twdanaob.error.log;
}

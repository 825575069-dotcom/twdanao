# twdanaom.88yldh.com - H5 移动端
server {
    listen 80;
    server_name twdanaom.88yldh.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name twdanaom.88yldh.com;

    ssl_certificate /etc/letsencrypt/live/88yldh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88yldh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    root /home/web/twdanao/mobile;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/twdanaom.access.log;
    error_log /var/log/nginx/twdanaom.error.log;
}

# twdanao.88yldh.com - 前端桌面管理端 + 管理后台 + 供应商门户
server {
    listen 80;
    server_name twdanao.88yldh.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name twdanao.88yldh.com;

    ssl_certificate /etc/letsencrypt/live/88yldh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88yldh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # YesGo Admin Dashboard (SPA)
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        root /home/web/twdanao;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Supplier Portal (SPA) — ^~ prevents regex override
    location = /supplier-portal {
        return 301 /supplier-portal/;
    }
    location ^~ /supplier-portal/ {
        alias /home/web/twdanao/supplier-portal/;
        try_files $uri $uri/ /supplier-portal/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # AI 数字员工前端桌面管理端
    location / {
        root /home/web/twdanao/frontend;
        index web.html;
        try_files $uri $uri/ /web.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 反向代理到 Gunicorn :3008
    location /api/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    access_log /var/log/nginx/twdanao.access.log;
    error_log /var/log/nginx/twdanao.error.log;
}

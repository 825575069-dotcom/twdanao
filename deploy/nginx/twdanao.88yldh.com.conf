# twdanao.88yldh.com - 前端桌面管理端 + 管理后台
server {
    listen 80;
    server_name twdanao.88yldh.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name twdanao.88yldh.com;

    ssl_certificate /etc/letsencrypt/live/88yldh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88yldh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # YesGo Admin Dashboard (SPA)
    location /admin/ {
        alias /home/web/twdanao/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    # AI 数字员工前端桌面管理端
    location / {
        root /home/web/twdanao/frontend;
        index index.html web.html;
        try_files $uri $uri/ /index.html;
    }

    # Assets cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    access_log /var/log/nginx/twdanao.access.log;
    error_log /var/log/nginx/twdanao.error.log;
}

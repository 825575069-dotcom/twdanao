############### sync
sync-code-job:
  stage: sync
  script:
    - echo "【代码】同步 开始..."
    - rsync -vazr --delete --exclude={'public/','runtime/','resource/','docker/','docs/','web/node_modules','*dist/','AGENTS.md'} -og --chown=www:www $LOCAL_PATH/* $REMOTE_NGINX_IP:$REMOTE_NGINX_PATH/
    - echo "【代码】同步 结束..."
  tags:
    - OPS-RUNNER-3


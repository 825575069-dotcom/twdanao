before_script:
  - echo "作业路径：$CI_PROJECT_DIR"
  - node -v

variables:
  REMOTE_NGINX_IP: "192.168.2.180"
  REMOTE_NGINX_PATH: "/home/web/test.yesgo.86yfw.com"
  REMOTE_NGINX_PUBLIC_PATH: "/home/web/test.yesgo.86yfw.com/public"
  LOCAL_PATH: "$CI_PROJECT_DIR"
  LOCAL_VIEW_PATH: "$CI_PROJECT_DIR"
  LOCAL_PUBLIC_PATH: "$CI_PROJECT_DIR/public"

cache:
  untracked: true
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - web/node_modules/

stages:
  - dependent #依赖
  - build #构建
  - sync #同步

############### dependent

dependent-web-job:
  stage: dependent
  script:
    - cd web
    - echo "【Web端】 yarn 安装依赖 开始..."
    - yarn install --frozen-lockfile --production=false
    - echo "【Web端】 yarn 安装依赖 结束..."
  tags:
    - OPS-RUNNER-3
  only:
    changes:
      - web/package.json
      - .init.ci



############### build
build-web-job:
  stage: build
  script:
    - cd web
    - echo "【Web端】 npm 打包项目 开始..."
    - VITE_PUBLIC_BASE=/public/web/ yarn build
    - echo "【Web端】 npm 打包项目 结束..."
    - echo "【Web端】 远程部署 开始..."
    - rsync -avzrp --delete  -og --chown=www:www $LOCAL_VIEW_PATH/web/dist/ $REMOTE_NGINX_IP:$REMOTE_NGINX_PUBLIC_PATH/web/
    - echo "【Web端】 远程部署 结束..."
  tags:
    - OPS-RUNNER-3
  only:
    changes:
      - web/**/*
      - .init.ci
      - .build.ci
  artifacts:
    name: "web"
    paths:
      - ./web/dist
